/* ===== GitScout v0.8.0 · Dark Neon Glassmorphism theme ===== */
:root{
  color-scheme:dark;
  --ink:#edf4ff;
  --muted:#8d9bb2;
  --line:rgba(151,180,220,.17);
  --purple:#8c70ff;
  --purple-soft:rgba(140,112,255,.15);
  --green:#32d6a0;
  --orange:#ffb45e;
}
html{background:#060b14}
body{
  color:#edf4ff;
  background:
    radial-gradient(ellipse at 7% 13%,rgba(0,166,255,.15),transparent 27%),
    radial-gradient(ellipse at 88% 24%,rgba(117,75,255,.16),transparent 29%),
    radial-gradient(ellipse at 54% 95%,rgba(0,205,210,.07),transparent 30%),
    linear-gradient(135deg,#070c16 0%,#0a1221 48%,#080d19 100%);
  background-attachment:fixed;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;
  background-image:linear-gradient(rgba(103,153,208,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(103,153,208,.055) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent 88%);
}
.app{position:relative;z-index:1;min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,rgba(7,13,25,.97),rgba(8,15,29,.94));
  border-right:1px solid rgba(126,171,225,.16);
  box-shadow:12px 0 40px rgba(0,0,0,.18);
  color:#dce8fb;
}
.brand{padding-bottom:30px}
.brand-mark{
  background:linear-gradient(140deg,#25d5e8 0%,#4778ff 48%,#9565ff 100%);
  box-shadow:0 0 24px rgba(72,139,255,.38),inset 0 1px 0 rgba(255,255,255,.35);
}
.brand strong{letter-spacing:.1px}
.brand small{color:#7f91ac}
.nav-label{color:#5e7290}
.nav button{color:#91a2bd;border:1px solid transparent;transition:.2s ease}
.nav button:hover{color:#f4f8ff;background:rgba(86,133,205,.11);border-color:rgba(109,166,239,.12)}
.nav button.active{
  color:#fff;
  background:linear-gradient(100deg,rgba(37,167,229,.22),rgba(125,93,255,.25));
  border-color:rgba(105,175,255,.26);
  box-shadow:0 0 22px rgba(62,135,255,.13),inset 0 0 18px rgba(89,139,255,.07);
}
.nav button.active .ico{color:#59d7ff}
.local-card{background:rgba(21,37,61,.58);border-color:rgba(125,166,220,.18);backdrop-filter:blur(14px)}
.local-card b{color:#e6f0ff}
.local-card small,.side-link{color:#8192ad}
.main{background:transparent}
.topbar{
  color:#aab9d0;background:rgba(7,13,25,.72);
  border-bottom:1px solid rgba(129,169,220,.15);
  backdrop-filter:blur(18px);
}
.crumb{color:#6f829f}
.crumb strong{color:#dbe8fa}
.online{color:#51d7a8}
.version{border-color:rgba(127,164,218,.22);background:rgba(33,52,81,.36);color:#8fa6c8}
.page-head h1{color:#f0f6ff;letter-spacing:-.65px}
.page-head p{color:#8e9db5}
.content{position:relative}
.hero{
  min-height:230px;padding:28px 30px;
  border:1px solid rgba(124,174,236,.29);
  background:
    radial-gradient(ellipse at 86% 50%,rgba(94,80,255,.28),transparent 34%),
    radial-gradient(ellipse at 15% 10%,rgba(0,197,232,.17),transparent 45%),
    linear-gradient(112deg,rgba(14,34,59,.96),rgba(18,28,57,.95) 58%,rgba(33,28,70,.94));
  box-shadow:0 18px 55px rgba(0,0,0,.23),inset 0 1px 0 rgba(255,255,255,.08),0 0 35px rgba(61,136,255,.08);
  gap:26px;
}
.hero:after{
  width:300px;height:300px;right:16%;top:-170px;
  border-color:rgba(91,201,255,.16);
  box-shadow:0 0 0 35px rgba(255,255,255,.025),0 0 0 75px rgba(255,255,255,.018);
}
.hero h2{font-size:27px;line-height:1.2;color:#f5f8ff;max-width:470px}
.hero p{color:#b2c2d9;max-width:520px;line-height:1.7}
.eyebrow{color:#9d8cff;letter-spacing:1.7px}
.hero-chart{
  position:relative;z-index:2;flex:0 1 52%;min-width:310px;max-width:610px;
  padding:15px 17px 11px;border-radius:13px;
  border:1px solid rgba(129,185,247,.30);
  background:linear-gradient(145deg,rgba(7,18,35,.77),rgba(19,31,58,.62));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 35px rgba(0,0,0,.2),0 0 24px rgba(54,170,255,.08);
  backdrop-filter:blur(18px);
}
.hero-chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-chart-head span:first-child{display:block;color:#8ca5c6;font-size:9px;letter-spacing:1.3px;font-weight:700}
.hero-chart-head strong{display:block;color:#f4f8ff;font-size:25px;line-height:1.25;margin-top:5px}
.hero-chart-head small{display:block;color:#8da0bd;font-size:10px;margin-top:2px}
.live-pill{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid rgba(62,214,168,.22);border-radius:30px;color:#68ddb3;font-size:8px;letter-spacing:.6px;background:rgba(37,177,133,.08)}
.live-pill i{width:6px;height:6px;border-radius:50%;background:#39dfa8;box-shadow:0 0 9px #39dfa8}
.hero-chart svg{width:100%;height:112px;display:block;margin-top:6px;overflow:visible}
.chart-grid path{stroke:rgba(135,167,208,.13);stroke-width:1;fill:none;stroke-dasharray:3 5}
.chart-area{fill:url(#trendFill)}
.chart-line{fill:none;stroke:url(#trendLine);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(69,205,255,.55))}
.chart-point{fill:#8c7bff;stroke:#e4dcff;stroke-width:2;filter:drop-shadow(0 0 6px #927cff)}
.hero-chart-foot{display:flex;justify-content:space-between;color:#7086a7;font-size:8px;letter-spacing:1px;padding-top:7px;border-top:1px solid rgba(137,174,222,.12)}
.stats{gap:13px}
.stat,.card{
  color:#e8f1ff;
  background:linear-gradient(145deg,rgba(23,39,64,.76),rgba(13,24,42,.79));
  border:1px solid rgba(128,169,222,.20);
  box-shadow:0 8px 26px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter:blur(16px);
}
.stat{position:relative;overflow:hidden;min-height:116px;padding:16px 17px;border-radius:12px}
.stat:before,.card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(106,198,255,.30),transparent);pointer-events:none}
.stat:hover,.card:hover{border-color:rgba(111,179,255,.31);box-shadow:0 12px 34px rgba(0,0,0,.22),0 0 24px rgba(66,145,255,.055),inset 0 1px 0 rgba(255,255,255,.07)}
.stat-top{color:#91a3bf}
.stat-icon{background:linear-gradient(145deg,rgba(31,170,226,.18),rgba(132,95,255,.2));color:#65d9ff;border:1px solid rgba(93,177,255,.18);box-shadow:0 0 16px rgba(64,162,255,.1)}
.stat strong{color:#f3f7ff}
.stat small{color:#8194b1}
.card{position:relative;overflow:hidden;padding:18px;border-radius:12px}
.card-head h3{color:#eaf2ff}
.card-head p{color:#8598b4}
.btn{
  border:1px solid rgba(137,174,224,.25);border-radius:8px;
  background:rgba(25,43,69,.75);color:#c7d7ef;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:.18s ease;
}
.btn:hover{border-color:rgba(88,196,255,.58);color:#fff;background:rgba(33,62,99,.82);box-shadow:0 0 18px rgba(46,177,255,.12)}
.primary{
  border-color:transparent;color:#fff;
  background:linear-gradient(105deg,#22bfe5 0%,#477df5 48%,#8d55f3 100%);
  box-shadow:0 5px 18px rgba(72,113,255,.26),inset 0 1px 0 rgba(255,255,255,.28);
}
.primary:hover{color:#fff;background:linear-gradient(105deg,#36d3ee,#5d8cff 48%,#a16cff);box-shadow:0 7px 23px rgba(84,113,255,.35)}
.soft{background:rgba(100,91,211,.14);color:#b4aaff;border-color:rgba(145,123,255,.25)}
.tabs{background:rgba(4,12,24,.55);border:1px solid rgba(126,165,218,.13)}
.tabs button{color:#879bb8}
.tabs button.active{color:#fff;background:linear-gradient(110deg,rgba(36,178,230,.25),rgba(129,91,255,.30));box-shadow:inset 0 0 0 1px rgba(121,168,255,.24),0 0 16px rgba(82,119,255,.13)}
.filters input,.filters select,.field{
  border:1px solid rgba(130,168,218,.22);background:rgba(7,16,31,.68);color:#dce8fb;
}
.filters input::placeholder,.form-row input::placeholder,.form-row textarea::placeholder{color:#637895}
.filters input:focus,.filters select:focus,.field:focus{border-color:#5cbdf6;box-shadow:0 0 0 3px rgba(55,176,238,.10)}
.table-card{background:rgba(12,23,40,.82)}
.table-card table{color:#c7d5e9}
.table-card th{background:rgba(28,45,69,.72);color:#8297b5;border-bottom:1px solid rgba(136,172,219,.14)}
.table-card td{border-top:1px solid rgba(131,166,211,.12);color:#aebed4}
.table-card td b{color:#e7f0ff}
.table-card td small{color:#8194b0}
.table-card tr:hover td{background:rgba(62,126,191,.08)}
.repo{color:#78d9ff}
.muted{color:#8296b3}
.up{color:#3cdda9}
.down{color:#ff8294}
.chip{background:rgba(112,103,226,.16);color:#b9b1ff;border:1px solid rgba(151,130,255,.16)}
.chip.green{background:rgba(39,190,142,.12);color:#65dfb6;border-color:rgba(56,212,164,.16)}
.chip.amber{background:rgba(226,166,70,.12);color:#f0c27d;border-color:rgba(226,166,70,.16)}
.chip.gray{background:rgba(133,157,190,.12);color:#a2b3ca;border-color:rgba(133,157,190,.15)}
.rank{background:linear-gradient(145deg,rgba(47,170,220,.17),rgba(124,92,240,.18));color:#9edfff;border:1px solid rgba(99,174,239,.18)}
.bar{background:rgba(129,156,193,.15)}
.bar span{background:linear-gradient(90deg,#29d4d0,#5b91ff,#a26cff);box-shadow:0 0 12px rgba(88,156,255,.35)}
.note{background:rgba(19,34,56,.72);border:1px solid rgba(127,166,216,.16);color:#92a5c0}
.notice{background:rgba(72,75,157,.14);border:1px solid rgba(137,123,255,.25);color:#c4bbff}
.pill{background:rgba(37,190,142,.13);color:#64dfb5;border:1px solid rgba(51,212,163,.18)}
.pill.warn{background:rgba(229,170,73,.13);color:#f0c47f;border:1px solid rgba(229,170,73,.18)}
.pill.purple{background:rgba(133,107,255,.16);color:#c0b5ff;border:1px solid rgba(148,124,255,.2)}
.project-card{border-top-color:rgba(131,168,213,.13)}
.project-card h4{color:#e1ecfb}
.project-card p{color:#879bb8}

{repo:"kajisho5/ffmpeg-skill",desc:"42 local FFmpeg tools and MCP server for coding agents.",lang:"Python",stars:"1.1k",tags:["音视频处理","MCP"],status:"关注中"},
{repo:"heygen-com/hyperframes",desc:"Open-source AI video editor: write HTML, render MP4.",lang:"TypeScript",stars:"4.9k",tags:["AI 视频生成","Motion Graphics"],status:"关注中"},

{repo:"heygen-com/hyperframes",desc:"Open-source AI video editor",lang:"TypeScript",stars:"4.9k",delta:"+986",forks:"221",topics:["ai-video","motion"]},
{repo:"HKUDS/CLI-Anything",desc:"Making ALL Software Agent-Native",lang:"Python",stars:"7.6k",delta:"+840",forks:"680",topics:["agent","cli"]},
{repo:"ChromeDevTools/chrome-devtools-mcp",desc:"Chrome DevTools for coding agents",lang:"TypeScript",stars:"13.4k",delta:"+720",forks:"510",topics:["mcp","chrome"]},
{repo:"mvanhorn/last30days-skill",desc:"Research any topic across social platforms",lang:"Python",stars:"2.8k",delta:"+512",forks:"180",topics:["research","skills"]},
{repo:"cathrynlavery/diagram-design",desc:"Editorial diagram design for coding agents",lang:"HTML",stars:"1.2k",delta:"+390",forks:"92",topics:["svg","diagrams"]}
];
const allRepos=[...trending,...projects.filter(p=>!trending.some(t=>t.repo===p.repo)).map(p=>({...p,delta:"+0",forks:"—",topics:p.tags}))];
const titles={dashboard:["趋势总览","开源项目发现与研究工作台"],trending:["周期榜单","在同一入口切换日榜、周榜和月榜"],stars:["Stars 总榜","实时采集 GitHub 公开仓库，并按 Stars 数量排序"],recommendations:["智能推荐","基于 Stars 与日周月上榜表现生成可解释的推荐评分"],compare:["周期趋势对比","追踪项目在不同周期与历史批次中的排名变化"],interested:["感兴趣项目","保存值得持续关注的项目"],research:["项目研究","管理研究状态、目标、笔记与结论"],repositories:["项目库","统一管理所有发现过的 GitHub 仓库"],"repository-detail":["项目详情","查看仓库信息、趋势表现与工作区状态"],collections:["采集记录","查看采集任务、执行状态与运行日志"],settings:["采集设置","配置采集频率、数据保存和本地运行"],system:["系统设置","管理本地运行环境、SQLite 备份与数据恢复"]};
let current="dashboard",period="daily",starSort="desc",searchTerm="",recommendMode="balanced",detailRepo=allRepos[0].repo;
const $=s=>document.querySelector(s);

$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)setPage(b.dataset.page)});
function cardHead(t,s="",right=""){return `<div class="card-head"><div><h3>${t}</h3>${s?`<p>${s}</p>`:""}</div>${right}</div>`}
function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><div class="stat-top"><span>${x[0]}</span><span class="stat-icon">${x[1]}</span></div><strong>${x[2]}</strong><small>${x[3]}</small></div>`).join("")}</div>`}
function escapeIdentity(value){return String(value||"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function identityMarkup(fullName,description="",variant="table",action="detail"){
  const parts=String(fullName||"").split("/");
  const owner=escapeIdentity(parts.shift()||"");
  const repoName=escapeIdentity(parts.join("/")||fullName);
  const safeFull=escapeIdentity(fullName);
  const title=action==="external"
    ? '<a class="repository-identity-title" href="https://github.com/'+safeFull+'" target="_blank" rel="noreferrer">'+repoName+' ↗</a>'
    : action==="plain"
      ? '<strong class="repository-identity-title">'+repoName+'</strong>'
      : '<button type="button" class="repository-identity-title" onclick="openRepository(&quot;'+safeFull+'&quot;)">'+repoName+'</button>';
  return '<div class="repository-identity repository-identity--'+variant+'"><span class="repository-identity-accent"></span><div class="repository-identity-content"><span class="repository-identity-owner">'+owner+'</span>'+title+(description?'<small class="repository-identity-description">'+escapeIdentity(description)+'</small>':'')+'</div></div>';
}
function rankMedalMarkup(rank){
  const palette={1:["#ffd66b","#a96a24"],2:["#e7edf7","#8294aa"],3:["#df9a68","#8c4b2d"]};
  const colors=palette[rank]||["#9fc8f2","#466b9b"];
  return '<span class="prototype-rank-medal rank-'+rank+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 8 5 4 3-7 3 7 5-4-2 12H6L4 8Z" fill="'+colors[0]+'" stroke="'+colors[1]+'" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 22h8" stroke="'+colors[1]+'" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
}
function table(rows,kind="trending"){
  return '<div class="card table-card"><div class="table-wrap"><table><thead><tr><th>排名</th><th>项目</th><th>语言</th><th>Stars</th><th>'+(kind==="stars"?"Forks":"新增 Stars")+'</th><th>操作</th></tr></thead><tbody>'+
    rows.map((r,i)=>'<tr><td><span class="rank">'+(i+1)+'</span></td><td>'+identityMarkup(r.repo,r.desc,"table","detail")+'</td><td>'+(r.lang||"—")+'</td><td>'+r.stars+'</td><td class="'+(kind==="stars"?"":"up")+'">'+(kind==="stars"?(r.forks||"—"):r.delta)+'</td><td><button class="btn soft" onclick="toggleInterest(\''+r.repo+'\')">'+(isInterested(r.repo)?"已关注":"＋ 关注")+'</button></td></tr>').join("")+
    '</tbody></table></div></div>';
}
function isInterested(repo){return projects.some(p=>p.repo===repo)}
function setPeriod(p){period=p;render()}
function toggleInterest(repo){
  const index=projects.findIndex(p=>p.repo===repo);
  if(index>=0){projects.splice(index,1);toast("已取消关注："+repo);}
  else{
    const source=allRepos.find(p=>p.repo===repo);
    if(source)projects.push({...source,tags:source.tags||source.topics||[],status:"关注中"});
    toast("已标记关注："+repo);
  }
  render();
}
function filterProjects(v){document.querySelectorAll("#projectList .project-card").forEach(el=>el.style.display=el.dataset.search.includes(v.toLowerCase())?"flex":"none")}

function closeModal(){$("#modalBg").classList.remove("show")}

</div></div>${stats([["项目库仓库","▦","2,486","已发现并归档"],["关注项目","♡","9","当前关注清单"],["研究项目","⌕","4","持续跟进中"],["最近采集","◷","12 分钟前","Trending 日榜"]])}<div class="grid2"><div class="card">${cardHead("最新趋势动态","最近一次周期榜单采集结果",'<button class="btn" onclick="setPage(\'trending\')">查看榜单 →</button>')}<div class="project-card"><div>${identityMarkup("vercel-labs/agent-browser","Browser automation CLI for AI agents","compact","detail")}<div class="project-meta"><span class="chip">Rust</span><span class="chip green">+1,240 Stars</span></div></div><span class="pill">日榜 #1</span></div><div class="project-card"><div>${identityMarkup("heygen-com/hyperframes","Open-source AI video editor","compact","detail")}<div class="project-meta"><span class="chip">TypeScript</span><span class="chip green">+986 Stars</span></div></div><span class="pill">周榜 #3</span></div><div class="project-card"><div>${identityMarkup("HKUDS/CLI-Anything","Making ALL Software Agent-Native","compact","detail")}<div class="project-meta"><span class="chip">Python</span><span class="chip green">+840 Stars</span></div></div><span class="pill">月榜 #8</span></div></div><div class="card">${cardHead("采集与系统状态","本地数据与任务状态")}<div class="project-card"><div><h4>Trending 周期采集</h4><p>日榜、周榜、月榜独立保存历史快照</p></div><span class="pill">正常</span></div><div class="project-card"><div><h4>Stars 总榜</h4><p>按 Stars 降序的全局采集任务</p></div><span class="pill warn">待手动启动</span></div><div class="project-card"><div><h4>数据库备份</h4><p>自动备份 · 每 24 小时 · 保留 14 份</p></div><span class="pill">已启用</span></div></div></div><div class="card">${cardHead("近期值得研究","来自当前关注项目清单")}<div class="project-card"><div>${identityMarkup("HKUDS/CLI-Anything","研究方向：Agent 如何通过 CLI 驱动现有软件","compact","detail")}</div><button class="btn" onclick="setPage('research')">打开研究页</button></div><div class="project-card"><div>${identityMarkup("heygen-com/hyperframes","研究方向：HTML / Motion Graphics / AI 视频渲染","compact","detail")}</div><button class="btn" onclick="setPage('research')">打开研究页</button></div></div function setPage(p){
  current=p;
  const activePage=p==="repository-detail"?"repositories":p;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===activePage));
  $("#crumb").textContent=titles[p][0];
  $("#title").textContent=titles[p][0];
  $("#subtitle").textContent=titles[p][1];
  const action=p==="interested"?'<button class="btn primary" onclick="showImport()">导入关注清单</button>'
    :p==="research"?'<button class="btn primary" onclick="newResearch()">＋ 新建研究</button>'
    :p==="repository-detail"?'<button class="btn" onclick="setPage(&quot;repositories&quot;)">← 返回项目库</button>'
    :"";
  $("#headAction").innerHTML=action;
  render();
}
function openRepository(repo){detailRepo=repo;setPage("repository-detail");}
function repositoryDetailBody(){
  const r=allRepos.find(item=>item.repo===detailRepo)||allRepos[0];
  if(!r)return '<div class="empty">暂无项目数据</div>';
  const tags=(r.topics||r.tags||[]).map(tag=>'<span class="chip">'+tag+'</span>').join('');
  const stars=r.stars||'—';
  const delta=r.delta||'—';
  const forks=r.forks||'—';
  const watched=isInterested(r.repo);
  const action='<div class="mini-actions">'
    +'<button class="btn primary" type="button" onclick="toggleInterest(&quot;'+r.repo+'&quot;)">'+(watched?'取消关注':'＋ 关注')+'</button>'
    +'<button class="btn soft" type="button" onclick="openResearch(&quot;'+r.repo+'&quot;)">加入研究</button>'
    +'<a class="btn soft" href="https://github.com/'+r.repo+'" target="_blank" rel="noreferrer">GitHub ↗</a></div>';
  return '<div class="stack">'
    +'<div class="hero repository-detail-hero"><div><div class="eyebrow">REPOSITORY DETAIL · DEMO</div>'+identityMarkup(r.repo,r.desc,'hero','plain')+'<div class="project-meta"><span class="chip">'+(r.lang||'未知语言')+'</span><span class="chip">'+stars+' Stars</span><span class="chip">'+forks+' Forks</span></div></div>'+action+'</div>'
    +stats([["Stars 总量","★",stars,"当前示例数据"],["周期增量","↗",delta,"最近榜单增量"],["Forks","⑂",forks,"公开仓库 Fork 数"],["关注状态","♡",watched?"已关注":"未关注","本原型中的演示状态"]])
    +'<div class="grid2"><div class="card">'+cardHead("趋势表现","示意趋势，用于展示正式详情页的图表区域")+'<div class="repository-detail-chart"><svg viewBox="0 0 520 150" preserveAspectRatio="none" role="img" aria-label="仓库趋势示意图"><g class="chart-grid"><path d="M0 20H520 M0 55H520 M0 90H520 M0 125H520"/></g><path class="chart-area" d="M0 118 C35 108 48 95 82 101 S130 76 164 84 S210 53 244 67 S296 78 328 52 S380 62 410 38 S470 36 520 12 V150 H0Z"/><path class="chart-line" d="M0 118 C35 108 48 95 82 101 S130 76 164 84 S210 53 244 67 S296 78 328 52 S380 62 410 38 S470 36 520 12"/><circle cx="520" cy="12" r="4" class="chart-point"/></svg></div><div class="hero-chart-foot"><span>STARS MOMENTUM</span><span>24H · 7D · 30D</span></div></div>'
    +'<div class="card">'+cardHead("项目资料","仓库元信息与技术标签")+'<div class="project-meta"><span class="chip">'+(r.lang||'未知语言')+'</span>'+tags+'</div><div class="note">原型数据仅用于演示详情页布局；正式 React 页面读取 SQLite 中的仓库主档与历史快照。</div></div></div>'
    +'<div class="card">'+cardHead("工作区状态","关注与研究相互独立")+'<div class="project-card"><div><h4>感兴趣项目</h4><p>加入个人关注清单，便于后续持续跟踪</p></div><span class="pill">'+(watched?'已关注':'未关注')+'</span></div><div class="project-card"><div><h4>项目研究</h4><p>独立维护研究目标、下一步行动、结论与笔记</p></div><div class="mini-actions"><button class="btn soft" type="button" onclick="openResearch(&quot;'+r.repo+'&quot;)">打开研究</button></div></div></div></div>';
}

function projectItem(p){
  return '<div class="project-card" data-search="'+escapeIdentity((p.repo+" "+p.desc+" "+p.tags.join(" ")).toLowerCase())+'"><div class="project-card-identity">'+identityMarkup(p.repo,p.desc,"card","external")+'<div class="project-meta"><span class="chip">'+p.lang+'</span><span class="chip">'+p.stars+' Stars</span>'+p.tags.map(t=>'<span class="chip">'+escapeIdentity(t)+'</span>').join("")+'</div></div><div class="mini-actions"><button onclick="openRepository(&quot;'+p.repo+'&quot;)">详情</button><button onclick="openResearch(&quot;'+p.repo+'&quot;)">加入研究</button></div></div>';
}

render();
