name: GitScout CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run SQLite tests
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Check UI design system consistency
        run: npm run check:theme
      - name: Build React application
        run: npm run build


  windows-smoke:
    name: Windows setup, launch and restore smoke test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run first-run setup
        shell: pwsh
        run: .\scripts\setup_gitscout.ps1
      - name: Verify launcher, backup and restore lifecycle
        shell: pwsh
        run: |
          try {
            .\scripts\start_gitscout.ps1
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/v1/health" -TimeoutSec 10
            if ($health.status -ne "ok") { throw "GitScout health check failed." }

            $backup = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/api/v1/system/backups" -TimeoutSec 120
            $filename = $backup.item.filename
            $escaped = [uri]::EscapeDataString($filename)
            $verified = Invoke-RestMethod -Method Post -Uri ("http://127.0.0.1:8765/api/v1/system/backups/" + $escaped + "/verify") -TimeoutSec 120
            if (-not $verified.result.valid) { throw "Created backup did not pass integrity validation." }

            $restore = Invoke-RestMethod -Method Post -Uri ("http://127.0.0.1:8765/api/v1/system/backups/" + $escaped + "/restore") -ContentType "application/json" -Body '{"confirm":true}' -TimeoutSec 120
            if (-not $restore.restore.restart_required) { throw "Restore was not queued for restart." }

            .\scripts\stop_gitscout.ps1
            .\scripts\start_gitscout.ps1
            $system = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/v1/system" -TimeoutSec 15
            if ($null -ne $system.info.pending_restore) { throw "Pending restore marker was not consumed." }
            if ($system.schema_version -ne "0005") { throw "Restored database schema version is unexpected." }
            if (-not $system.info.database_exists) { throw "Restored database is missing." }
          }
          finally {
            if (Test-Path ".runtime/gitscout.pid") {
              .\scripts\stop_gitscout.ps1
            }
          }
